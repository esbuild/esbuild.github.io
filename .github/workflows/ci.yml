name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  esbuild:
    name: esbuild CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go 1.x
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          
        id: go

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Make git work
        run: |
          git config --global user.email 'email@example.com'
          git config --global user.name 'example name'

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test
